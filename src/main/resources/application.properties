spring.application.name=SecureTicketingAPI

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing}
spring.datasource.username=${DB_USER:ticketing}
spring.datasource.password=${DB_PASSWORD:ticketing}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# TODO: set JWT_SECRET in production.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-please}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=500ms

reservation.soldout-cache.enabled=${SOLDOUT_CACHE_ENABLED:true}
reservation.soldout-cache.ttl=60s

reservation.hold.hold-ttl=${RESERVATION_HOLD_TTL:15m}
reservation.hold.sweep-interval=${RESERVATION_SWEEP_INTERVAL:60s}
reservation.hold.sweep-batch-size=${RESERVATION_SWEEP_BATCH_SIZE:200}

reservation.request.max-seats=${RESERVATION_MAX_SEATS:50}

idempotency.retention=${IDEMPOTENCY_RETENTION:24h}
idempotency.lease=${IDEMPOTENCY_LEASE:30s}
idempotency.sweep-interval=${IDEMPOTENCY_SWEEP_INTERVAL:5m}
idempotency.sweep-batch-size=${IDEMPOTENCY_SWEEP_BATCH_SIZE:500}

ratelimit.enabled=${RATELIMIT_ENABLED:true}
ratelimit.shared=${RATELIMIT_SHARED:true}
ratelimit.instances=${RATELIMIT_INSTANCES:1}
ratelimit.max-tracked-keys=${RATELIMIT_MAX_TRACKED_KEYS:50000}
ratelimit.auth.capacity=${RATELIMIT_AUTH_CAPACITY:10}
ratelimit.auth.window=${RATELIMIT_AUTH_WINDOW:1m}
ratelimit.reservation.capacity=${RATELIMIT_RESERVATION_CAPACITY:30}
ratelimit.reservation.window=${RATELIMIT_RESERVATION_WINDOW:1m}

resilience.circuit-breaker.failure-threshold=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
resilience.circuit-breaker.open-duration=${CIRCUIT_BREAKER_OPEN_DURATION:30s}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump,configprops
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

seed.demo=${SEED_DEMO:false}
